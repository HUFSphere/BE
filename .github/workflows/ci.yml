name: CI

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: linkboard
          MYSQL_USER: linkboard
          MYSQL_PASSWORD: linkboard
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew build
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: linkboard
          DB_USERNAME: linkboard
          DB_PASSWORD: linkboard
          NOTION_CLIENT_ID: dummy-ci-client-id
          NOTION_CLIENT_SECRET: dummy-ci-client-secret
