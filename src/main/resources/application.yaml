# 리버스 프록시(nginx)가 HTTPS를 종단하고 내부적으로는 http://8080으로 프록시하므로,
# 이 설정이 없으면 springdoc/Swagger가 X-Forwarded-Proto를 무시하고 서버 URL을 http://로
# 생성해 브라우저의 mixed-content 차단(HTTPS 페이지 → HTTP 요청)을 유발한다.
server:
  forward-headers-strategy: framework

spring:
  application:
    name: linkboard
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:linkboard}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-local-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-local-client-secret}

ai:
  server:
    url: ${AI_SERVER_URL:http://localhost:8000}

notion:
  client-id: ${NOTION_CLIENT_ID}
  client-secret: ${NOTION_CLIENT_SECRET}
  redirect-uri: ${NOTION_REDIRECT_URI:http://localhost:8080/api/v1/auth/notion/callback}

figma:
  client-id: ${FIGMA_CLIENT_ID}
  client-secret: ${FIGMA_CLIENT_SECRET}
  redirect-uri: ${FIGMA_REDIRECT_URI:http://localhost:8080/api/v1/auth/figma/callback}

github:
  client-id: ${GITHUB_CLIENT_ID}
  client-secret: ${GITHUB_CLIENT_SECRET}
  redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:8080/api/v1/auth/github/callback}

jwt:
  secret: ${JWT_SECRET:linkboard-local-dev-only-jwt-secret-key-please-change-32bytes+}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:3600000}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:1209600000}

oauth:
  google:
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/auth/oauth/google/callback}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://hufsphere-linkboard.vercel.app}
